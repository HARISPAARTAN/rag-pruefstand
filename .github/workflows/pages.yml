# Builds the site from the committed run artefacts and deploys it to GitHub Pages.
# Triggered by pushes to main that touch the site or its sources, and manually.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "runs/full-*/**"
      - "src/pruefstand/report/**"
      - "pruefstand.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pruefstand report
      - run: git diff --stat
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
